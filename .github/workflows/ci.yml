name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the images
        run: docker compose build
      - name: Start the stack and check it answers
        run: |
          docker compose up -d --wait
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:4000/health
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:3000/manifest.webmanifest
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
